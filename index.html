<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Indexa</title>
  <meta name="description" content="Indexa — directorio abierto de proyectos gratuitos construidos por desarrolladores independientes." />
  <link rel="icon" href="assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="header">
    <div class="header__left">
      <div class="wordmark">
        <img
          class="wordmark__logo"
          src="assets/logo.png"
          alt="Logo de Indexa"
          onerror="this.style.display='none'; document.querySelector('.wordmark__dot').style.display='inline-block';"
        />
        <span class="wordmark__dot"></span>
        Indexa
      </div>
      <h1 class="header__title">
        Proyectos<br><em>en producción</em>
      </h1>
      <p class="header__sub">
        Directorio de proyectos construidos por desarrolladores independientes.
      </p>
    </div>
    <div class="header__count">
      <div class="header__count-num" id="count-num">—</div>
      <div class="header__count-label">proyectos</div>
    </div>
  </header>

  <main class="grid-wrapper">

    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="9" cy="9" r="6.5"/>
        <path d="M18 18l-4-4"/>
      </svg>
      <input
        id="buscador"
        class="search-input"
        type="text"
        placeholder="Buscar por nombre, autor o descripción..."
        autocomplete="off"
      />
      <button id="limpiar-busqueda" class="search-clear hidden" aria-label="Limpiar búsqueda" type="button">✕</button>
    </div>

    <div id="grid-proyectos"></div>
  </main>

  <footer class="footer">
    <span class="footer__brand">Indexa</span>
    <span class="footer__note">Directorio abierto para desarrolladores independientes</span>
  </footer>

  <script src="script.js"></script>
</body>
</html>
